<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-forhåndsvisning (219)</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #111; background: #fff; display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  #vis { position: relative; min-width: 0; min-height: 0; }
  aside { border-left: 1px solid #d1d5db; padding: 12px; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 14px 0 4px; }
  select, button { font: inherit; padding: 3px 8px; }
  button[aria-pressed="true"] { background: #0891b2; color: #fff; border: 1px solid #0891b2; border-radius: 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { padding: 1px 4px; border-bottom: 1px solid #eee; } td:last-child { text-align: right; white-space: nowrap; }
  .adv { color: #b45309; font-size: 12px; margin: 4px 0; }
  .sum td { font-weight: 600; }
  label { display: block; margin-top: 8px; }
  #feil { color: #b91c1c; font-size: 12px; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; } aside { border-left: 0; border-top: 1px solid #d1d5db; } }
</style>
</head>
<body>
<div id="vis"></div>
<aside>
  <h1>3D-kontroll av taket</h1>
  <select id="fix" aria-label="Fixture"></select>
  <div style="margin-top:8px">
    <button id="s-strek">Strek</button> <button id="s-farge">Farge</button> <button id="reset">Nullstill vinkel</button>
  </div>
  <label><input type="checkbox" id="vismaal"> Vis mål</label>
  <div id="feil"></div>
  <div id="adv"></div>
  <div id="liste"></div>
</aside>
<script type="module">
import { byggTak, maal, tegnScene } from '../../varmeplan-3d.js';
const FIXTURER = [
  ['1-filmens-bygg', 'Filmens bygg'], ['2-saltak', 'Saltak'], ['3-l-form-8-kanter', 'L-form, 8 kanter'],
  ['4-flatt-tak', 'Flatt tak 40 × 20 m'], ['5-nedlop-under-bakken', 'Nedløp under bakken'],
];
const $ = id => document.getElementById(id);
let visning = null, stil = 'strek';
const tall = (v, d = 2) => v.toFixed(d).replace('.', ',');
function radene(M) {
  const r = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  let h = '';
  if (M.renner.length) h += '<h2>Rennestrekk</h2><table>' + M.renner.map(g => r(g.id, tall(g.lengde_m) + ' m') + g.delstrekk.map(s => r('&nbsp;&nbsp;' + s.id + ' · ' + s.lop + ' løp', tall(s.kabel_m) + ' m kabel')).join('')).join('') + '</table>';
  if (M.nedlop.length) h += '<h2>Nedløp</h2><table>' + M.nedlop.map(d => r(d.id + ' · ' + d.lop + ' løp', tall(d.over_m) + (d.under_m ? ' + ' + tall(d.under_m) : '') + ' m') + r('&nbsp;&nbsp;kabel', tall(d.kabel_m) + ' m')).join('') + '</table>';
  if (M.moner.length) h += '<h2>Møne</h2><table>' + M.moner.map(m => r(m.id, tall(m.lengde_m) + ' m')).join('') + '</table>';
  if (M.gradrenner.length) h += '<h2>Gradrenner</h2><table>' + M.gradrenner.map(g => r(g.id, tall(g.lengde_m) + ' m')).join('') + '</table>';
  if (M.snofangere.length) h += '<h2>Snøfangere</h2><table>' + M.snofangere.map(g => r(g.id, tall(g.lengde_m) + ' m')).join('') + '</table>';
  if (M.forbi.length) h += '<h2>Kabel forbi hindring</h2><table>' + M.forbi.map(f => r(f.id + ' · ' + f.lop + ' løp', tall(f.kabel_m) + ' m')).join('') + '</table>';
  if (M.sluk.length) h += `<h2>Sluk (${M.sluk.length})</h2><table>` + r('ringer', tall(M.kabel.sluk_ring_m) + ' m') + r('i rør', tall(M.kabel.sluk_ror_m) + ' m') + '</table>';
  if (M.varmefelt.length) h += '<h2>Varmefelt</h2><table>' + M.varmefelt.map(f => r(f.id, tall(f.areal_m2, 1) + ' m²')).join('') + '</table>';
  const K = M.kabel;
  h += '<h2>Kabel</h2><table>' + r('tegnet', tall(K.tegnet_m) + ' m') + K.ikke_tegnet.map(x => r(x.id + ' (fra data, ikke tegnet' + (x.i_sum ? '' : ', utenfor oppsettet') + ')', tall(x.kabel_m) + ' m')).join('') + `<tr class="sum"><td>Sum</td><td>${tall(K.sum_m)} m</td></tr></table>`;
  return h;
}
async function vis(id) {
  $('feil').textContent = '';
  try {
    const tak = await (await fetch(`fixtures/${id}.json`)).json();
    if (visning) visning.lukk();
    const scene = byggTak(tak, { stil });
    $('adv').innerHTML = scene.advarsler.map(a => `<div class="adv">⚠ ${a}</div>`).join('');
    $('liste').innerHTML = radene(maal(scene));
    visning = await tegnScene(scene, $('vis'), { stil, visMaal: $('vismaal').checked });
    window.__vis = { scene, visning, ferdig: true };
  } catch (e) { $('feil').textContent = String(e && e.stack || e); throw e; }
}
function settStilKnapper() { $('s-strek').setAttribute('aria-pressed', stil === 'strek'); $('s-farge').setAttribute('aria-pressed', stil === 'farge'); }
$('fix').innerHTML = FIXTURER.map(([id, navn]) => `<option value="${id}">${navn}</option>`).join('');
$('fix').onchange = e => vis(e.target.value);
for (const s of ['strek', 'farge']) $('s-' + s).onclick = () => { stil = s; settStilKnapper(); visning && visning.settStil(s); };
$('reset').onclick = () => visning && visning.tilbakestill();
$('vismaal').onchange = e => visning && visning.settVisMaal(e.target.checked);
settStilKnapper();
vis(FIXTURER[0][0]);
</script>
</body>
</html>
